<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="autobeat logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>autobeat</title>
  <defs>
    <clipPath id="deckL"><circle cx="78" cy="110" r="52"/></clipPath>
  </defs>

  <!-- Background (xoá dòng này nếu cần nền trong suốt) -->
  <rect width="640" height="220" rx="28" fill="#0B0B0B"/>

  <!-- Mark: hai deck giao nhau = auto mix -->
  <g fill="none" stroke="#01FF95" stroke-width="10">
    <circle cx="78" cy="110" r="52"/>
    <circle cx="138" cy="110" r="52"/>
  </g>
  <!-- Vùng giao = khoảnh khắc crossfade -->
  <circle cx="138" cy="110" r="52" fill="#01FF95" clip-path="url(#deckL)"/>

  <!-- Wordmark -->
  <text x="222" y="132" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="-2" fill="#FFFFFF">auto<tspan fill="#01FF95">beat</tspan></text>
</svg>
