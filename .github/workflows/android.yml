name: Android CI

on:
  workflow_dispatch:

jobs:
  build-dev-debug:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Setup local.properties
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Dev Debug APK
      run: ./gradlew assembleDevDebug --parallel --build-cache --configuration-cache

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autobeat-dev-debug
        path: app/build/outputs/apk/dev/debug/*.apk
        retention-days: 3

  build-prod-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > autobeat-release.jks
          echo "storeFile=autobeat-release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties
        else
          echo "No keystore secret — unsigned build"
          rm -f keystore.properties
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease --parallel --build-cache --configuration-cache

    - name: Verify pitch model packaged
      run: |
        ls app/build/outputs/apk/prod/release/
        APK=$(ls app/build/outputs/apk/prod/release/*.apk | head -1)
        echo "Checking $APK"
        unzip -l "$APK" | grep crepe_tiny.onnx

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: autobeat-prod-release-signed
        path: app/build/outputs/apk/prod/release/*.apk
        retention-days: 3

  publish-release:
    if: github.ref == 'refs/heads/main'
    needs: build-prod-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download APK Artifact
      uses: actions/download-artifact@v4
      with:
        name: autobeat-prod-release-signed
        path: dist

    - name: Create public release with APK
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
        if [ -z "$VERSION" ]; then echo "versionName not found in app/build.gradle.kts"; exit 1; fi
        TAG="v$VERSION"
        if [ "${{ github.repository }}" != "ngocthanhgl/Autobeat-DJ" ]; then REPO="ngocthanhgl/Autobeat-DJ"; else REPO="${{ github.repository }}"; fi
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release delete "$TAG" --repo "$REPO" --cleanup-tag --yes
        fi
        PREV=$(gh api "repos/$REPO/releases?per_page=1" --jq '.[0].tag_name' 2>/dev/null || true)
        if [ -n "$PREV" ]; then
          NOTES=$(gh api "repos/$REPO/compare/$PREV...${{ github.sha }}" --jq '[.commits[] | "- " + (.commit.message | split("\n")[0])] | join("\n")')
          if [ -z "$NOTES" ]; then NOTES="- Maintenance release."; fi
          NOTES="What's new in $TAG:"$'\n\n'"$NOTES"
        else
          NOTES="Release $TAG (commit ${{ github.sha }})."
        fi
        for f in dist/*.apk; do
          case "$(basename "$f")" in
            *arm64-v8a*)   mv "$f" "dist/Autobeat-DJ-arm64-v8a-release.apk" ;;
            *armeabi-v7a*) mv "$f" "dist/Autobeat-DJ-armeabi-v7a-release.apk" ;;
            *) echo "unexpected APK: $f"; exit 1 ;;
          esac
        done
        ls -l dist/
        gh release create "$TAG" dist/*.apk \
          --repo "$REPO" \
          --title "Autobeat Mix $TAG" \
          --notes "$NOTES"
